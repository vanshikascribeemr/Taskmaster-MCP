services:
  - type: web
    name: taskmaster-mcp
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: newsletter-db
          property: connectionString
      - key: TASKMASTER_API_URL
        value: https://hrms.scribeemr.com/api/HrmsWebApi
      - key: LOG_LEVEL
        value: info
      # Optionally add your API Key here if needed
      # - key: TASKMASTER_API_KEY
      #   value: your_api_key_here

databases:
  - name: newsletter-db
    plan: free
    databaseName: newsletter
    user: postgres
